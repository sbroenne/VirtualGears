name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an older run pointless, and these are slow macOS runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    # Xcode 26 is needed to build with the Swift 6 language mode.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Run the tests
        run: swift test --enable-code-coverage

      - name: Require 90% core line coverage
        run: |
          binary="$(find .build -type f -name VirtualGearsPackageTests -print -quit)"
          report="$(
            xcrun llvm-cov report "$binary" \
              -instr-profile=.build/debug/codecov/default.profdata \
              -ignore-filename-regex='Tests|Tools'
          )"
          printf '%s\n' "$report"
          coverage="$(
            printf '%s\n' "$report" |
              awk '/^TOTAL/ { gsub("%", "", $10); print $10 }'
          )"
          awk -v coverage="$coverage" 'BEGIN {
            if (coverage + 0 < 90) {
              printf "Core line coverage %.2f%% is below 90%%\n", coverage
              exit 1
            }
          }'

  build:
    name: App build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: [VirtualGears]
    steps:
      - uses: actions/checkout@v7

      # Built for the simulator so it needs no signing certificate, which
      # keeps the build honest without putting a private key on a runner.
      - name: Build ${{ matrix.scheme }}
        run: |
          xcodebuild build \
            -project VirtualGears.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    name: UI tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Run UI regression tests
        run: |
          xcodebuild test \
            -project VirtualGears.xcodeproj \
            -scheme VirtualGears \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -parallel-testing-enabled NO
